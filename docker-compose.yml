version: '3.8'

services:
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pflow-jupyter
    ports:
      - "8888:8888"
    volumes:
      # Mount the current directory to allow live editing
      - .:/workspace
      # Persist Julia packages
      - julia-packages:/root/.julia
    environment:
      - JULIA_PROJECT=/workspace
    working_dir: /workspace
    command: jupyter notebook --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token='' --NotebookApp.password=''

volumes:
  julia-packages:
